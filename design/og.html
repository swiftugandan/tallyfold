<!doctype html>
<!-- Source for site/og.png, the social preview. Regenerate with `make og`. -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700&family=Alegreya+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../site/styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { padding: 64px 72px; }
  .wordmark { font-size: 1.6rem; }
  h1 { font-size: 6.4rem; max-width: none; margin-top: 44px; }
  p.sub { font-size: 1.6rem; margin: 18px 0 0; max-width: 46rem; }
  .stick { margin-top: 36px; width: 1056px; }
  .stick .label { display: none; }
</style></head>
<body>
<span class="wordmark"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg> Tallyfold</span>
<h1>Tell your agent once.</h1>
<p class="sub">Memory your coding agents keep across sessions and projects, in a private git repo you own.</p>
<svg class="stick" viewBox="0 0 1000 200" role="img" aria-labelledby="stick-title stick-desc">
          <title id="stick-title">A split tally stick</title>
          <desc id="stick-desc">Two halves of a hazel stick with matching notches. The halves part, a new notch is cut through both at once, and they close again.</desc>
          <defs>
            <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--hazel-light)"/>
              <stop offset="1" stop-color="var(--hazel)"/>
            </linearGradient>
            <symbol id="notch" viewBox="0 0 20 18" preserveAspectRatio="none"><path d="M0 0 L10 18 L20 0 Z"/></symbol>
          </defs>

          <g class="half stock">
            <path class="wood" d="M28 30 Q20 30 20 42 L20 92 Q20 104 32 104 L968 104 Q980 104 980 92 L980 42 Q980 30 968 30 Z"/>
            <path class="grain" d="M60 48 C300 44 520 52 960 46 M150 66 C380 70 640 62 950 68 M40 86 C260 84 560 88 900 85"/>
            <g class="notches" transform="translate(0 104) scale(1 -1)">
              <use href="#notch" x="226" width="12" height="24"/>
              <use href="#notch" x="256" width="8" height="18"/>
              <use href="#notch" x="296" width="20" height="33"/>
              <use href="#notch" x="350" width="8" height="18"/>
              <use href="#notch" x="378" width="8" height="18"/>
              <use href="#notch" x="440" width="14" height="27"/>
              <use href="#notch" x="470" width="8" height="18"/>
              <use href="#notch" x="552" width="20" height="33"/>
              <use href="#notch" x="604" width="8" height="18"/>
              <use href="#notch" x="636" width="12" height="24"/>
              <use href="#notch" x="716" width="8" height="18"/>
              <use href="#notch" x="744" width="14" height="27"/>
              <g class="new"><use href="#notch" x="844" width="18" height="30"/></g>
            </g>
            <text class="label" x="20" y="20">on your machine</text>
          </g>

          <g class="half foil">
            <path class="wood" d="M152 106 Q140 106 140 118 L140 168 Q140 180 152 180 L968 180 Q980 180 980 168 L980 118 Q980 106 968 106 Z"/>
            <path class="grain" d="M170 124 C420 128 700 120 960 125 M180 144 C460 141 720 148 950 144 M200 164 C480 162 700 166 940 163"/>
            <g class="notches" transform="translate(0 106)">
              <use href="#notch" x="226" width="12" height="24"/>
              <use href="#notch" x="256" width="8" height="18"/>
              <use href="#notch" x="296" width="20" height="33"/>
              <use href="#notch" x="350" width="8" height="18"/>
              <use href="#notch" x="378" width="8" height="18"/>
              <use href="#notch" x="440" width="14" height="27"/>
              <use href="#notch" x="470" width="8" height="18"/>
              <use href="#notch" x="552" width="20" height="33"/>
              <use href="#notch" x="604" width="8" height="18"/>
              <use href="#notch" x="636" width="12" height="24"/>
              <use href="#notch" x="716" width="8" height="18"/>
              <use href="#notch" x="744" width="14" height="27"/>
              <g class="new"><use href="#notch" x="844" width="18" height="30"/></g>
            </g>
            <text class="label" x="128" y="150" text-anchor="end">in your repo</text>
          </g>
        </svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 32 32">
      <rect x="3" y="8" width="26" height="7" rx="2" fill="var(--hazel)"/>
      <rect x="7" y="17" width="22" height="7" rx="2" fill="var(--hazel)"/>
      <path d="M11 15 L13 11 L15 15 Z M19 15 L21 12 L23 15 Z M11 17 L13 21 L15 17 Z M19 17 L21 20 L23 17 Z" fill="var(--heartwood)"/>
    </symbol>
  </svg>
</body></html>
