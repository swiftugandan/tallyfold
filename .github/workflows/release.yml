name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Check the tag matches the plugin version
        run: test "v$(sed -n 's/^version //p' plugin/bin/release)" = "$GITHUB_REF_NAME"
      - run: make test
      - name: Build and check against the plugin's checksums
        run: make verify
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/tallyfold_*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/tallyfold_* --title "Tallyfold $GITHUB_REF_NAME" --generate-notes --verify-tag
