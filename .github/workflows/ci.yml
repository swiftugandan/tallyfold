name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make lint
      - run: make test
      # The binaries built here must match the checksums committed in the plugin,
      # or the next release would publish binaries the launcher refuses to run.
      - run: make verify
